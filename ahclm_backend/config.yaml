server:
  host: "0.0.0.0"
  port: 28000
  cors: true
  cors_origins: ["http://127.0.0.1:25173", "http://localhost:25173"]
  cors_max_age: 12h
  read_timeout: 30s
  write_timeout: 300s
  idle_timeout: 120s
  shutdown_timeout: 20s

database:
  host: "localhost"
  port: 15432
  user: "postgres"
  password: "123456"
  database: "ahclm"
  sslmode: "disable"
  max_open_connections: 25
  max_idle_connections: 5
  conn_max_lifetime: 30m

scanner:
  tls_port: 443
  timeout: 15s
  retries: 2
  retry_backoff_unit: 1s
  workers: 20
  rate_limit: 50
  http_idle_conn_timeout: 30s
  http_expect_continue_timeout: 1s
  user_agent: "AHCLM-CertMonitor/2.0 (+https://github.com/ahclm)"
  check_revocation: true    # OCSP (stapled + active) revocation checking
  check_crl: true           # CRL fallback — REQUIRED for CRL-only CAs like Let's Encrypt; CRLs are cached by URL
  crl_cache_ttl: 6h
  check_ari: true           # ACME Renewal Information (RFC 9773) — CA-recommended renewal window + emergency signal
  revocation_timeout: 15s
  ari_timeout: 10s
  ari_cache_default_ttl: 24h
  ari_cache_minimum_ttl: 1h
  # Independent public recursive views used to distinguish CDN steering from
  # a real topology transition.
  dns_resolvers: ["https://cloudflare-dns.com/dns-query", "https://dns.google/resolve", "https://dns.quad9.net/dns-query"]
  max_endpoint_samples: 16
  # TLS handshakes per address in an endpoint survey. More than one proves, within
  # one round, when an address fronts servers holding different certificates.
  endpoint_handshakes: 3
  # Every sampled address also receives one no-SNI control handshake. The result
  # is retained separately so SNI-selected and default certificates are not
  # confused with endpoint-to-endpoint diversity.
  endpoint_probe_concurrency: 4
  # Per deep round, actively recheck this many SAN names that were added or
  # removed during recent certificate replacements. Rounds rotate candidates.
  related_name_probe_limit: 8
  # Separate bounded budget: root CT/OCSP checks cannot cancel this follow-up.
  related_name_probe_timeout: 90s
  # Deep/manual scans also obtain a bounded independent DNS trace and HTTPS
  # handshake from three continents. This distinguishes a globally published
  # bad endpoint from a location-specific CDN/edge symptom.
  check_global_probes: true
  global_probe_endpoint: "https://api.globalping.io"
  # Set AHCLM_GLOBALPING_TOKEN in the environment for Globalping access.
  global_probe_token: ""
  global_probe_timeout: 45s
  global_probe_locations: ["NA", "EU", "AS"]
  # Keep routine anomaly/deep-scan enrichment from consuming the full
  # Globalping account allowance needed by the CDN propagation worker.
  global_probe_scan_tests_per_hour: 100
  check_caa: true
  check_ct: true
  ct_timeout: 30s        # crt.sh round-trips measured at 3-12s; 8s timed out on most rounds and left 96% of findings with no independent issuance record
  ct_endpoint: "https://crt.sh"
  check_http_fingerprint: true
  check_rdap: true
  rdap_timeout: 8s
  rdap_endpoint: "https://rdap.org"
  check_asn: true
  check_ripestat: true
  ripestat_endpoint: "https://stat.ripe.net/data/prefix-overview/data.json"
  check_official_prefixes: true
  cloudflare_ipv4_url: "https://www.cloudflare.com/ips-v4"
  cloudflare_ipv6_url: "https://www.cloudflare.com/ips-v6"
  fastly_public_ip_url: "https://api.fastly.com/public-ip-list"
  cloudfront_ip_url: "https://d7uri8nf7uskq.cloudfront.net/tools/list-cloudfront-ips"
  aws_ip_ranges_url: "https://ip-ranges.amazonaws.com/ip-ranges.json"
  bunny_edge_list_url: "https://api.bunny.net/system/edgeserverlist/plain"
  check_chrome_log_list: true
  chrome_log_list_url: "https://www.gstatic.com/ct/log_list/v3/log_list.json"
  check_apple_log_list: true
  apple_log_list_url: "https://valid.apple.com/ct/log_list/current_log_list.json"
  check_sct_inclusion: true
  check_certspotter: true
  certspotter_endpoint: "https://api.certspotter.com/v1/issuances"
  ari_providers:
    - name: "Let's Encrypt"
      directory_url: "https://acme-v02.api.letsencrypt.org/directory"
      issuer_common_name_patterns: ["^[RE][0-9]{1,2}$"]
      issuer_organization_contains: ["Let's Encrypt"]
    - name: "Google Trust Services"
      directory_url: "https://dv.acme-v02.api.pki.goog/directory"
      issuer_common_name_patterns: ["^W[RE][0-9]{1,2}$"]
      issuer_organization_contains: ["Google Trust Services"]

scheduler:
  enabled: true
  tick_interval: 1m
  # Re-scan each certificate as it crosses these day-marks before expiry:
  milestones: [30, 14, 10, 7, 3, 1]
  # ...and these day-marks after expiry (catch renewals / take-downs):
  post_expiry_checks: [1, 3, 7]
  baseline_interval: 168h    # far-from-expiry cadence (7 days)
  near_expiry_interval: 6h   # cadence within ~1 day of expiry
  min_gap: 1h                # never scan the same domain more often than this
  ari_poll_interval: 24h     # fallback ARI renewalInfo poll when the CA omits Retry-After
  revocation_poll_interval: 24h # low-frequency OCSP/CRL sweep for unchanged certificates
  max_daily_scans: 100000
  scan_timeout: 90s
  failure_backoff_unit: 6h
  failure_backoff_max: 72h
  near_expiry_window: 48h
  ari_change_threshold: 1h
  ari_poll_due_tolerance: 1m

# A separate, bounded worker measures how quickly a newly observed leaf reaches
# independent Globalping locations. The source timestamp can also be supplied
# explicitly through the propagation API for controlled certificate rotations.
propagation:
  enabled: true
  auto_start_on_change: true
  cdn_only: true
  watch_window: 24h
  poll_interval: 15m
  max_duration: 72h
  stable_rounds: 2
  locations: ["NA", "EU", "AS"]
  timeout: 45s
  max_active: 32

tranco:
  enabled: true
  source_url: "https://tranco-list.eu/top-1m.csv.zip"
  max_domains: 10000
  fetch_on_start: true
  refresh_interval: 24h
  request_timeout: 120s
  cache_ttl: 12h
  max_response_bytes: 134217728
  user_agent: "AHCLM-CertMonitor/2.0"

# Additional populations are combined with the current Tranco Top-10000.
# Paths are resolved relative to this config file (ahclm_backend/).
local_lists:
  enabled: true
  fetch_on_start: true
  refresh_interval: 24h
  sources:
    - name: "secrank-topdomain1m"
      path: "../analysis/secrank-topdomain1M-domainonly-20240722.txt"
      format: "lines"
      max_domains: 10000
    - name: "secrank-icp"
      path: "../analysis/domains_secrank-icp-out.txt"
      format: "jsonl"
      max_domains: 10000

alerts:
  enabled: true
  webhook_enabled: false
  webhook_url: ""
  smtp_host: ""
  smtp_port: 587
  email_from: ""
  email_to: ""
  email_user: ""
  email_password: ""

# Operator standards applied by the diagnosis (not measurements).
analysis:
  # An open certificate rollout is reported as stuck when the time both the old
  # and the new leaf were proven live is longer than this share of the
  # completed rollouts in the reference distribution certainly took. The
  # distribution is measured from retained snapshots (see
  # ahclm_rollout_duration_statistics.md); 0 disables the stuck verdict.
  rollout_alert_share: 0.99
  rollout_reference_refresh: 6h
